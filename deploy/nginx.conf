map $http_x_reader_client_ip $reader_client_ip {
    "" $remote_addr;
    default $http_x_reader_client_ip;
}
limit_req_zone $reader_client_ip zone=reader_ai:1m rate=12r/m;
limit_conn_zone $reader_client_ip zone=reader_connections:1m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        set $backend http://api:3000;
        proxy_pass $backend/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }
    location = /api/llm {
        client_max_body_size 128k;
        client_body_timeout 10s;
        limit_req zone=reader_ai burst=6 nodelay;
        limit_req_status 429;
        limit_conn reader_connections 4;
        limit_conn_status 429;
        set $backend http://api:3000;
        proxy_pass $backend/api/llm;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 185s;
        proxy_next_upstream off;
    }
    location ^~ /api/ { return 404; }
    location = /index.html {
        expires -1;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
