name: Sync to Gitee

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_PASSWORD }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
        run: |
          git remote add gitee https://$GITEE_USER:$GITEE_TOKEN@gitee.com/yfhs/english-context-reader.git
          git push --force gitee main
