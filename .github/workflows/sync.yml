name: sync

on:
  push:
    branches: [ "main" ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirroring
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/HendySen01/english-context-reader
          dst: gitee/yfhs/english-context-reader
          static_list: "english-context-reader"
          dst_key: ${{ secrets.GITEE_PASSWORD }}
          dst_token: ${{ secrets.GITEE_PASSWORD }}
          account_type: user
          # 核心設定：將 GitHub 的 main 分支對應同步到 Gitee 的 master 分支
          src_branch: main
          dst_branch: master
